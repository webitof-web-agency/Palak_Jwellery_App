<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PALAK Jewellers — Staff Sales App</title>
    <meta
      name="description"
      content="Download the PALAK Jewellers staff sales app for Android — scan supplier QR codes, record sales, and sync with the admin console."
    />
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <meta name="theme-color" content="#0a0a0a" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
      :root {
        --bg: #050505;
        --surface: rgba(15, 15, 15, 0.7);
        --panel-border: rgba(229, 180, 99, 0.15);
        --text: #fdfdfd;
        --text-muted: rgba(253, 253, 253, 0.65);
        --gold-light: #fbe6ba;
        --gold: #e5b463;
        --gold-dark: #b17f3a;
        --shadow-premium: 0 30px 60px rgba(0, 0, 0, 0.8);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        background-color: var(--bg);
        background-image: 
          radial-gradient(circle at 15% 0%, rgba(229, 180, 99, 0.08) 0%, transparent 50%),
          radial-gradient(circle at 85% 100%, rgba(229, 180, 99, 0.05) 0%, transparent 50%);
        color: var(--text);
        font-family: "Outfit", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        overflow: hidden; /* No scroll */
      }

      /* Navbar */
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 32px 48px;
        position: relative;
        z-index: 10;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        text-decoration: none;
      }

      .brand img {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        border: 1px solid var(--panel-border);
      }

      .brand span {
        font-family: "Cinzel", serif;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.15em;
        color: var(--gold);
        text-transform: uppercase;
      }

      .nav-login {
        font-family: "Outfit", sans-serif;
        font-weight: 500;
        font-size: 14px;
        color: var(--text);
        text-decoration: none;
        padding: 10px 24px;
        border-radius: 999px;
        border: 1px solid var(--panel-border);
        transition: all 0.3s ease;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(10px);
      }

      .nav-login:hover {
        border-color: var(--gold);
        color: var(--gold);
        background: rgba(229, 180, 99, 0.05);
      }

      /* Main Content */
      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        position: relative;
        z-index: 10;
      }

      .hero-content {
        text-align: center;
        max-width: 700px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .eyebrow {
        font-family: "Cinzel", serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.4em;
        color: var(--gold);
        text-transform: uppercase;
        margin-bottom: 24px;
        display: inline-block;
        border-bottom: 1px solid var(--panel-border);
        padding-bottom: 8px;
      }

      h1 {
        font-family: "Cinzel", serif;
        font-weight: 500;
        font-size: clamp(40px, 6vw, 64px);
        line-height: 1.1;
        margin-bottom: 24px;
        color: var(--text);
        text-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
      }

      p.lede {
        font-weight: 300;
        font-size: 18px;
        line-height: 1.6;
        color: var(--text-muted);
        margin-bottom: 48px;
        max-width: 540px;
      }

      /* Version Badge */
      .version-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 16px;
        background: rgba(229, 180, 99, 0.1);
        border: 1px solid rgba(229, 180, 99, 0.2);
        border-radius: 999px;
        font-size: 12px;
        font-weight: 500;
        color: var(--gold-light);
        letter-spacing: 0.1em;
        margin-top: 16px;
        text-transform: uppercase;
        transition: opacity 0.5s ease;
      }

      .version-badge .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--gold);
        box-shadow: 0 0 8px var(--gold);
        animation: pulse 2s infinite;
      }

      .version-badge[hidden] {
        display: none;
      }

      @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(229, 180, 99, 0.4); }
        70% { box-shadow: 0 0 0 6px rgba(229, 180, 99, 0); }
        100% { box-shadow: 0 0 0 0 rgba(229, 180, 99, 0); }
      }

      /* Download Action */
      .download-btn {
        display: inline-flex;
        align-items: center;
        gap: 16px;
        padding: 20px 40px;
        border-radius: 4px;
        font-family: "Cinzel", serif;
        font-weight: 600;
        font-size: 16px;
        letter-spacing: 0.1em;
        color: var(--bg);
        background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
        text-decoration: none;
        transition: all 0.3s ease;
        box-shadow: 0 10px 30px rgba(229, 180, 99, 0.2);
        position: relative;
        overflow: hidden;
      }

      .download-btn::after {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
        transition: left 0.7s ease;
      }

      .download-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 40px rgba(229, 180, 99, 0.3);
      }

      .download-btn:hover::after {
        left: 100%;
      }

      .download-btn .icon {
        width: 24px;
        height: 24px;
      }

      .platforms {
        margin-top: 16px;
        font-size: 12px;
        color: var(--text-muted);
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      /* Ambient Background Elements */
      .ambient-glow {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 80vw;
        height: 80vw;
        max-width: 1000px;
        max-height: 1000px;
        background: radial-gradient(circle, rgba(229, 180, 99, 0.03) 0%, transparent 60%);
        z-index: 1;
        pointer-events: none;
      }

      /* Footer */
      footer {
        text-align: center;
        padding: 24px;
        font-size: 12px;
        color: var(--text-muted);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        position: relative;
        z-index: 10;
      }

      @media (max-width: 768px) {
        header {
          flex-direction: column;
          gap: 24px;
          padding: 24px;
        }
        
        .download-btn {
          width: 100%;
          justify-content: center;
        }
        
        body {
          overflow: auto; /* Allow scroll on small mobile if needed */
        }
      }
    </style>
  </head>
  <body>
    <div class="ambient-glow"></div>
    
    <header>
      <a href="/" class="brand">
        <img src="/assets/logo.png" alt="PALAK Jewellers Logo" />
        <span>Palak Jewellers</span>
      </a>
      <a class="nav-login" href="https://admin.palakjewellers.co.in">
        Admin Login &rarr;
      </a>
    </header>

    <main>
      <div class="hero-content">
        <span class="eyebrow">Staff Sales App</span>
        <h1>Sales & Inventory<br>Suite</h1>

        <p class="lede">
          The Android app our sales team uses day to day — scan supplier
          QR codes, record sale sessions, and sync straight to the admin
          console.
        </p>

        <div>
          <a class="download-btn" href="https://api.palakjewellers.co.in/download">
            <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            Download Android App
          </a>
          <div class="platforms">Available for Android devices</div>
          <div class="version-badge" id="versionBadge" hidden>
            <span class="dot"></span>
            <span id="versionText"></span>
          </div>
        </div>
      </div>
    </main>

    <footer>
      &copy; <span id="year"></span> PALAK Jewellers. All rights reserved.
    </footer>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();

      // Best-effort: shows the current release version if the backend's
      // CORS_ORIGIN allows this domain.
      fetch("https://api.palakjewellers.co.in/api/v1/app-version/latest")
        .then((res) => (res.ok ? res.json() : Promise.reject()))
        .then((payload) => {
          const version = payload?.data?.version;
          if (!version) return;
          document.getElementById("versionText").textContent =
            "Latest Release: v" + version;
          document.getElementById("versionBadge").hidden = false;
        })
        .catch(() => {
          /* CORS not configured for this origin yet, or offline — ignore. */
        });
    </script>
  </body>
</html>
