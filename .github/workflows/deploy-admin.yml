name: Build & Deploy Admin Panel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "admin-panel/**"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/palak-jewellers-admin

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./admin-panel
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.API_BASE_URL }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy redeploy
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_ADMIN_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::DOKPLOY_ADMIN_WEBHOOK secret not set — image was still built and pushed to ${{ env.IMAGE }}:latest. Deploy it manually in Dokploy for now, or add the secret to automate this step."
            exit 0
          fi
          curl -fsS -X POST "$WEBHOOK"
