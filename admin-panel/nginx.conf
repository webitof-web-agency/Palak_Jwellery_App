server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: any path that isn't a real file falls back to index.html
    # so React Router can handle it client-side (matches the vercel.json
    # rewrite this app already relies on when deployed there).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must always be revalidated — otherwise a browser can keep
    # serving a stale HTML file that references JS/CSS bundles a later
    # deploy has already deleted (hashed filenames change every build).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Hashed build assets (filename changes every build) are safe to cache
    # aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
